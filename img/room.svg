<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="roomTitle">
  <title id="roomTitle">Line drawing of a treatment room</title>
  <g fill="none" stroke="#222422" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity=".82">

    <!-- floor / wall -->
    <path d="M0 472 H900"/>
    <path d="M0 486 H900" opacity=".35"/>

    <!-- window, left -->
    <rect x="62" y="96" width="196" height="212"/>
    <path d="M62 130 H258 M62 164 H258 M62 198 H258 M62 232 H258 M62 266 H258" opacity=".45"/>
    <path d="M160 96 V308" opacity=".3"/>

    <!-- pendant lamp -->
    <path d="M392 0 V104"/>
    <path d="M356 148 L392 104 L428 148 Z"/>
    <path d="M356 148 H428"/>
    <circle cx="392" cy="163" r="5" opacity=".5"/>

    <!-- framed print -->
    <rect x="486" y="118" width="118" height="146"/>
    <path d="M504 232 C 524 186 546 210 568 168 S 590 200 590 200" opacity=".5"/>

    <!-- wall shelf with bottles -->
    <path d="M666 250 H842"/>
    <path d="M676 250 V240 M832 250 V240" opacity=".5"/>
    <rect x="692" y="212" width="18" height="38" rx="2"/>
    <path d="M697 212 v-9 h8 v9" />
    <rect x="722" y="200" width="22" height="50" rx="2"/>
    <path d="M729 200 v-11 h8 v11"/>
    <rect x="758" y="220" width="16" height="30" rx="2"/>
    <path d="M762 220 v-8 h8 v8"/>

    <!-- treatment bed -->
    <!-- raised headrest -->
    <path d="M150 330 L232 306 L246 344 L164 368 Z"/>
    <!-- mattress -->
    <path d="M232 348 H678 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 H232 a8 8 0 0 1 -8 -8 v-24 a8 8 0 0 1 8 -8 Z"/>
    <!-- base -->
    <path d="M252 388 H658 v22 H252 Z"/>
    <path d="M276 410 V472 M634 410 V472"/>
    <path d="M276 448 H634" opacity=".4"/>
    <!-- rolled towel at the head -->
    <ellipse cx="268" cy="340" rx="26" ry="13"/>
    <path d="M254 336 q14 -7 28 0" opacity=".5"/>
    <!-- folded towel draped over the foot -->
    <path d="M560 348 h74 v58 h-74 Z" opacity=".7"/>
    <path d="M560 366 h74 M560 384 h74" opacity=".35"/>

    <!-- stool -->
    <ellipse cx="756" cy="392" rx="40" ry="14"/>
    <path d="M716 392 v10 a40 14 0 0 0 80 0 v-10"/>
    <path d="M756 416 V456"/>
    <path d="M730 472 L756 456 L782 472"/>

    <!-- trolley, left -->
    <path d="M64 372 H166 V472 H64 Z"/>
    <path d="M64 410 H166 M64 442 H166" opacity=".45"/>
    <rect x="80" y="342" width="15" height="30" rx="2"/>
    <path d="M84 342 v-8 h7 v8"/>
    <rect x="104" y="334" width="17" height="38" rx="2"/>
    <path d="M109 334 v-9 h7 v9"/>
    <ellipse cx="142" cy="366" rx="14" ry="6"/>

    <!-- plant, right -->
    <path d="M846 428 h44 l-6 44 h-32 Z"/>
    <path d="M868 428 C 862 392 844 380 838 360 M868 428 C 874 396 892 386 896 366 M868 428 C 866 404 856 392 852 380" opacity=".75"/>
    <path d="M838 360 q-10 -12 2 -18 q12 6 -2 18 Z" opacity=".6"/>
    <path d="M896 366 q10 -13 -2 -19 q-12 7 2 19 Z" opacity=".6"/>

  </g>
</svg>
